[package]
name = "lan-scanner"
version = "0.1.2"
edition = "2024"
description = "Linux LAN IP and MAC address scanner"
license = "MIT"
readme = "README.md"
repository = "https://github.com/dimyvi/lan-scanner"
homepage = "https://github.com/dimyvi/lan-scanner"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
ipnetwork = "0.21.1"
tokio = { version = "1.54.1", features = ["full"] }
